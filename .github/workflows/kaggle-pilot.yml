name: WSP pilot on free Kaggle GPU

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: weightspace-heavy-gpu
  cancel-in-progress: false

jobs:
  pilot:
    if: github.ref == 'refs/heads/main' && github.repository == 'xxammaxx/mindloop-weightspace-lab' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment: KAGGLE_API_TOKEN
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install and smoke test official CLI without secrets
        run: |
          python3 -m venv "$RUNNER_TEMP/kaggle-cli"
          "$RUNNER_TEMP/kaggle-cli/bin/python" -m pip install --disable-pip-version-check 'kaggle==2.2.5' 'six==1.17.0' 'numpy==2.2.6'
          "$RUNNER_TEMP/kaggle-cli/bin/kaggle" --version
          "$RUNNER_TEMP/kaggle-cli/bin/kaggle" kernels push --help
          "$RUNNER_TEMP/kaggle-cli/bin/python" -m unittest discover -s weightspace_ci/tests -v
      - name: Check budget, dispatch one private GPU job, retrieve validated metrics
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          export PATH="$RUNNER_TEMP/kaggle-cli/bin:$PATH"
          python -m weightspace_ci.dispatch
      - name: Upload sanitized evidence only
        uses: actions/upload-artifact@v4
        with:
          name: wsp-pilot-${{ github.run_id }}
          path: pilot-results/metrics.json
          if-no-files-found: error
          retention-days: 30
