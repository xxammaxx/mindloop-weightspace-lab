name: Kaggle access preflight

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kaggle-preflight
  cancel-in-progress: false

jobs:
  preflight:
    if: github.ref == 'refs/heads/main' && github.repository == 'xxammaxx/mindloop-weightspace-lab'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: KAGGLE_API_TOKEN
    steps:
      - name: Install pinned official CLI without credentials
        run: |
          python3 -m venv "$RUNNER_TEMP/kaggle-cli"
          # Kaggle 2.2.5 imports six without declaring it; python-dateutil >=4 no longer supplies it.
          # Upstream fix: Kaggle/kaggle-cli#1239. Keep the explicit pin until upgrading.
          "$RUNNER_TEMP/kaggle-cli/bin/python" -m pip install --disable-pip-version-check 'kaggle==2.2.5' 'six==1.17.0'
      - name: Smoke test CLI startup without credentials
        run: |
          "$RUNNER_TEMP/kaggle-cli/bin/kaggle" --version
          "$RUNNER_TEMP/kaggle-cli/bin/kaggle" quota --help
      - name: Check authenticated accelerator quota without disclosing credentials
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        shell: bash
        run: |
          set -eu
          if [ -z "$KAGGLE_API_TOKEN" ]; then
            echo 'BLOCKED: KAGGLE_API_TOKEN missing in the environment.'
            exit 1
          fi
          if ! "$RUNNER_TEMP/kaggle-cli/bin/kaggle" quota --format json > "$RUNNER_TEMP/quota.json" 2> "$RUNNER_TEMP/quota.err"; then
            # Never print raw CLI output: it may include credentials or account data.
            if grep -qiE '401|unauthorized|unauthenticated|authentication required|invalid (api )?token|invalid credentials' "$RUNNER_TEMP/quota.err" "$RUNNER_TEMP/quota.json"; then
              echo 'BLOCKED: AUTH_REJECTED (authentication failed).'
            elif grep -qiE '403|forbidden|permission denied' "$RUNNER_TEMP/quota.err" "$RUNNER_TEMP/quota.json"; then
              echo 'BLOCKED: ACCESS_DENIED (Kaggle refused permission).'
            elif grep -qiE 'unrecognized arguments|invalid choice' "$RUNNER_TEMP/quota.err" "$RUNNER_TEMP/quota.json"; then
              echo 'BLOCKED: CLI_ARGUMENT_ERROR.'
            elif grep -qiE 'connectionerror|connection refused|max retries exceeded|certificate verify failed|timed out' "$RUNNER_TEMP/quota.err" "$RUNNER_TEMP/quota.json"; then
              echo 'BLOCKED: CONNECTION_ERROR.'
            elif grep -qiE 'not enough values to unpack' "$RUNNER_TEMP/quota.err" "$RUNNER_TEMP/quota.json"; then
              echo 'BLOCKED: SDK_PARSE_ERROR.'
            else
              echo 'BLOCKED: UNCLASSIFIED (CLI or API error).'
            fi
            echo 'No GPU job dispatched.'
            exit 1
          fi
          "$RUNNER_TEMP/kaggle-cli/bin/python" -c 'import json,sys; data=json.load(open(sys.argv[1])); assert isinstance(data,list) and data and all(isinstance(row,dict) and "resource" in row and "remaining" in row for row in data), "Unrecognized quota response"; print("PASS: authenticated quota response received; GPU not launched.")' "$RUNNER_TEMP/quota.json"
